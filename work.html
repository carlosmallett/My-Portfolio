<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carlos Mallett | Work</title>
  <meta name="description" content="Work archive for Carlos Mallett." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="work.css" />
</head>
<body>
  <div class="work-ambient work-ambient-a"></div>
  <div class="work-ambient work-ambient-b"></div>

  <main class="work-page">
    <header class="work-header card">
      <p class="work-eyebrow">Portfolio Access</p>
      <h1>Selected Work</h1>
      <p class="privacy-note">Privacy note: Some client and partner work is intentionally not included due to privacy rights and access restrictions.</p>
    </header>

    <section class="work-row card" data-row>
      <div class="row-top">
        <h2>Design Projects</h2>
      </div>
      <div class="row-carousel">
        <button class="row-arrow" type="button" data-dir="left" aria-label="Scroll Design Projects left">&larr;</button>
        <div class="row-track" data-track>
          <article class="work-tile">
            <a class="work-tile-link" href="Projects/story-weaver-presentation.pdf" aria-label="Open StoryWaver presentation PDF">
              <img class="work-tile-image" src="images/StoryWaver Logo.png" alt="StoryWaver logo" loading="lazy" decoding="async" />
            </a>
          </article>
          <article class="work-tile">
            <a class="work-tile-link" href="Projects/APIARY%20Presentation.pdf" aria-label="Open Apiary presentation PDF">
              <img class="work-tile-image" src="images/APIARY LOGO 1 (1).png" alt="Apiary logo" loading="lazy" decoding="async" />
            </a>
          </article>
          <article class="work-tile">
            <a class="work-tile-link" href="Projects/Insight%20Engine%202.0%20Presentation.pdf" aria-label="Open Insight Engine 2.0 presentation PDF">
              <img class="work-tile-image work-tile-image-cmac" src="images/CMAC Logo.png" alt="CMAC logo" loading="lazy" decoding="async" />
            </a>
          </article>
        </div>
        <button class="row-arrow" type="button" data-dir="right" aria-label="Scroll Design Projects right">&rarr;</button>
      </div>
    </section>

    <section class="work-row card" data-row>
      <div class="row-top">
        <h2>Marketing</h2>
      </div>
      <div class="row-carousel">
        <button class="row-arrow" type="button" data-dir="left" aria-label="Scroll Marketing left">&larr;</button>
        <div class="row-track" data-track>
          <article class="work-tile">
            <a class="work-tile-link" href="str-graphics.html" aria-label="Open Small Twon Record Visuals gallery">
              <img class="work-tile-image work-tile-image-marketing-str" src="images/STR Logo.png" alt="STR logo" loading="lazy" decoding="async" />
            </a>
          </article>
        </div>
        <button class="row-arrow" type="button" data-dir="right" aria-label="Scroll Marketing right">&rarr;</button>
      </div>
    </section>

    <section class="work-row card" data-row>
      <div class="row-top">
        <h2>Branding</h2>
      </div>
      <div class="row-carousel">
        <button class="row-arrow" type="button" data-dir="left" aria-label="Scroll Branding left">&larr;</button>
        <div class="row-track" data-track>
          <article class="work-tile">
            <a class="work-tile-link" href="Projects/The%20Collective%20Brand%20Kit.pdf" aria-label="Open The Collective brand kit PDF">
              <img class="work-tile-image work-tile-image-branding-collective" src="images/The Collective Logo.png" alt="The Collective logo" loading="lazy" decoding="async" />
            </a>
          </article>
        </div>
        <button class="row-arrow" type="button" data-dir="right" aria-label="Scroll Branding right">&rarr;</button>
      </div>
    </section>

    <section class="work-row card" data-row>
      <div class="row-top">
        <h2>Coursework</h2>
      </div>
      <div class="row-carousel">
        <button class="row-arrow" type="button" data-dir="left" aria-label="Scroll Coursework left">&larr;</button>
        <div class="row-track" data-track>
          <article class="work-tile">
            <a class="work-tile-link" href="Projects/Standard%20Agency%20Presenation.pdf" aria-label="Open Standard Agency presentation PDF">
              <img class="work-tile-image work-tile-image-coursework-standard" src="images/Standard Agency Logo.png" alt="Standard Agency logo" loading="lazy" decoding="async" />
            </a>
          </article>
          <article class="work-tile work-tile-writing">
            <a class="work-tile-link work-tile-link-writing" href="creative-writing.html" aria-label="Open Creative Writing collection">
              <span class="writing-tile-title">Creative Writing</span>
              <span class="writing-tile-meta">4 selected pieces</span>
            </a>
          </article>
          <article class="work-tile work-tile-writing">
            <a class="work-tile-link work-tile-link-writing" href="video-journalism.html" aria-label="Open Video Journalism collection">
              <span class="writing-tile-title">Video Journalism</span>
              <span class="writing-tile-meta">4 video stories</span>
            </a>
          </article>
        </div>
        <button class="row-arrow" type="button" data-dir="right" aria-label="Scroll Coursework right">&rarr;</button>
      </div>
    </section>
  </main>

  <script src="work.js"></script>
</body>
</html>
